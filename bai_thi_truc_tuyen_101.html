  <script>
    const CONFIG = {"title":"ĐỀ KIỂM TRA ĐỊNH KỲ MÔN TOÁN THPT","teacherName":"Thầy Quân - Tổ Toán","schoolClass":"Trường THPT Tiên Du số 1 - Lớp 10A3","examCode":"101","duration":45,"maxScore":10,"openTime":"2026-01-01T07:00","closeTime":"2027-12-31T23:59","instructions":"Học sinh đọc kỹ đề bài, kiểm tra đầy đủ các câu hỏi trong bảng điều hướng bên phải trước khi nhấn NỘP BÀI.","showAnswerMode":"after_submit","allowViewResult":true,"tfScoringMode":"partial_equal","shortAnsDecimalBoth":true,"shortAnsAllowFraction":true,"shortAnsAllowTolerance":false,"shortAnsTolerance":0.01,"allowRetake":false,"gasWebAppUrl":"https://script.google.com/macros/s/AKfycbzDAZ2-fsK6XHYuT7NjC41Vi95oTMDBKtQuSWRE2to-y62DgwAbcYvnQgGnVkG4drfC/exec","hostedBaseUrl":"https://Nguyenquan174.github.io/OnToan10/bai_thi_truc_tuyen_101.html","githubRepoInput":"https://github.com/Nguyenquan174/OnToan10","githubBranch":"main","githubFileNameMode":"by_code"};
    const QUESTIONS = [{"id":"Q1","number":1,"type":"choice","stem":"Trong không gian $Oxyz$, điểm nào dưới đây thuộc đường thẳng $d: \\begin{cases} x=1+t \\\\ y=2-2t \\\\ z=-3+3t \\end{cases}$ ?","points":0.45,"required":true,"options":[{"label":"A","content":"$M_1(-1;-2;3)$"},{"label":"B","content":"$M_4(-1;2;-3)$"},{"label":"C","content":"$M_3(1;-2;3)$"},{"label":"D","content":"$M_2(1;2;-3)$"}],"statements":[],"solutionHtml":"Thay tọa độ điểm $M_2(1;2;-3)$ vào phương trình đường thẳng $d$, ta có:\n\t\t$\\begin{cases} 1=1+t \\\\ 2=2-2t \\\\ -3=-3+3t \\end{cases} \\Leftrightarrow \\begin{cases} t=0 \\\\ 2t=0 \\\\ 3t=0 \\end{cases} \\Leftrightarrow t=0$.\n\t\tVì có giá trị $t=0$ thỏa mãn cả ba phương trình, nên điểm $M_2$ thuộc đường thẳng $d$.","choiceHash":"e10c2473","tfHashes":[],"shortHash":""},{"id":"Q2","number":2,"type":"choice","stem":"Cho hàm số $y = f(x)$ có $f'(x) = x^3 - 3x + 2$. Hỏi hàm số $f(x)$ có bao nhiêu cực trị?","points":0.45,"required":true,"options":[{"label":"A","content":"2"},{"label":"B","content":"1"},{"label":"C","content":"3"},{"label":"D","content":"0"}],"statements":[],"solutionHtml":"Để tìm số cực trị của hàm số $f(x)$, ta cần tìm các nghiệm của phương trình $f'(x) = 0$ và xét dấu của $f'(x)$ xung quanh các nghiệm đó.\n\t\tTa có $f'(x) = x^3 - 3x + 2$.\n\t\tĐặt $f'(x) = 0 \\Leftrightarrow x^3 - 3x + 2 = 0$.\n\t\tNhận thấy $x=1$ là một nghiệm của phương trình: $1^3 - 3(1) + 2 = 1 - 3 + 2 = 0$.\n\t\tDo đó, $x-1$ là một nhân tử của $f'(x)$.\n\t\tThực hiện phép chia đa thức hoặc dùng sơ đồ Horner:\n\t\t$x^3 - 3x + 2 = (x-1)(x^2 + x - 2) = (x-1)^2(x+2)$.\n\t\tVậy, $f'(x) = (x-1)^2(x+2)$.\n\t\t$f'(x) = 0 \\Leftrightarrow (x-1)^2(x+2) = 0 \\Leftrightarrow \\left[ \\begin{array}{l} x-1=0 \\\\ x+2=0 \\end{array} \\right. \\Leftrightarrow \\left[ \\begin{array}{l} x=1 \\\\ x=-2 \\end{array} \\right.$.\n\t\tBảng xét dấu của $f'(x)$:\n\t\t<div class=\"text-center my-2\">\n\t\t\t\n          <div class=\"my-3 overflow-x-auto flex justify-center\">\n            <table class=\"border-2 border-slate-800 bg-white text-slate-900 text-sm shadow-2xs\" style=\"border-collapse: collapse; min-width: 420px;\">\n              <tbody>\n                <tr class=\"border-b-2 border-slate-800\">\n                  <td class=\"px-4 py-2 font-bold text-center border-r-2 border-slate-800 bg-slate-50 whitespace-nowrap\">$x$</td>\n                  <td class=\"px-3 py-2 text-center font-semibold whitespace-nowrap\">$-\\infty$</td><td class=\"px-2 py-2 text-center\"></td><td class=\"px-3 py-2 text-center font-semibold whitespace-nowrap\">$-2$</td><td class=\"px-2 py-2 text-center\"></td><td class=\"px-3 py-2 text-center font-semibold whitespace-nowrap\">$1$</td><td class=\"px-2 py-2 text-center\"></td><td class=\"px-3 py-2 text-center font-semibold whitespace-nowrap\">$+\\infty$</td>\n                </tr>\n                <tr class=\"border-b border-slate-800\">\n            <td class=\"px-4 py-2 font-bold text-center border-r-2 border-slate-800 bg-slate-50 whitespace-nowrap\">$f'(x)$</td>\n            <td class=\"px-2 py-2 text-center font-bold\"></td><td class=\"px-2 py-2 text-center font-bold\">-</td><td class=\"px-2 py-2 text-center font-bold\">0</td><td class=\"px-2 py-2 text-center font-bold\">+</td><td class=\"px-2 py-2 text-center font-bold\">0</td><td class=\"px-2 py-2 text-center font-bold\">+</td><td class=\"px-2 py-2 text-center font-bold\"></td>\n          </tr>\n                \n              </tbody>\n            </table>\n          </div>\n        \n\t\t</div>\n\t\tTừ bảng xét dấu, ta thấy:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>Tại $x=1$, $f'(x)$ bằng 0 nhưng không đổi dấu (từ dương sang dương). Do đó, $x=1$ không phải là điểm cực trị.</li><li>Tại $x=-2$, $f'(x)$ đổi dấu từ âm sang dương. Do đó, $x=-2$ là một điểm cực tiểu của hàm số.</li></ul>\n\t\tVậy, hàm số $f(x)$ có 1 điểm cực trị.","choiceHash":"e70c2de5","tfHashes":[],"shortHash":""},{"id":"Q3","number":3,"type":"choice","stem":"Cho hình chóp $S.ABCD$ có đáy $ABCD$ là hình bình hành. Khi đó $\\overrightarrow{SB} + \\overrightarrow{AD}$ bằng","points":0.45,"required":true,"options":[{"label":"A","content":"$\\overrightarrow{SC}$"},{"label":"B","content":"$\\overrightarrow{SD}$"},{"label":"C","content":"$\\overrightarrow{SA}$"},{"label":"D","content":"$\\overrightarrow{SB}$"}],"statements":[],"solutionHtml":"Vì $ABCD$ là hình bình hành nên $\\overrightarrow{AD} = \\overrightarrow{BC}$.\n\t\tDo đó $\\overrightarrow{SB} + \\overrightarrow{AD} = \\overrightarrow{SB} + \\overrightarrow{BC} = \\overrightarrow{SC}$ (theo quy tắc ba điểm của phép cộng vector).","choiceHash":"e40c292c","tfHashes":[],"shortHash":""},{"id":"Q4","number":4,"type":"choice","stem":"Cho hình chóp $S.ABC$ có đáy là tam giác $ABC$ vuông cân tại $C$, $SA \\perp (ABC)$. Góc giữa hai mặt phẳng $(SBC)$ và $(ABC)$ là","points":0.45,"required":true,"options":[{"label":"A","content":"$\\widehat{BSC}$"},{"label":"B","content":"$\\widehat{SBA}$"},{"label":"C","content":"$\\widehat{SCA}$"},{"label":"D","content":"$\\widehat{ASC}$"}],"statements":[],"solutionHtml":"Ta có $SA \\perp (ABC) \\implies SA \\perp BC$.\n\t\tMặt khác, tam giác $ABC$ vuông tại $C \\implies AC \\perp BC$.\n\t\tVì $BC \\perp SA$ và $BC \\perp AC$, suy ra $BC \\perp (SAC)$.\n\t\tDo đó $BC \\perp SC$.\n\t\tGiao tuyến của hai mặt phẳng $(SBC)$ và $(ABC)$ là $BC$.\n\t\tTrong mặt phẳng $(ABC)$, ta có $AC \\perp BC$.\n\t\tTrong mặt phẳng $(SBC)$, ta có $SC \\perp BC$.\n\t\tVậy góc giữa hai mặt phẳng $(SBC)$ và $(ABC)$ là góc giữa hai đường thẳng $AC$ và $SC$, tức là $\\widehat{SCA}$.","choiceHash":"e60c2c52","tfHashes":[],"shortHash":""},{"id":"Q5","number":5,"type":"choice","stem":"Cho hàm số $y=f(x)$ có đạo hàm liên tục trên đoạn $[a ; b]$ và $f(a)=2 ; f(b)=5$. Khi đó $\\displaystyle\\int_{a}^{b} f'(x) \\,dx$ bằng","points":0.45,"required":true,"options":[{"label":"A","content":"$7$"},{"label":"B","content":"$3$"},{"label":"C","content":"$10$"},{"label":"D","content":"$-3$"}],"statements":[],"solutionHtml":"Theo định lý cơ bản của giải tích, ta có:\n\t\t$\\int_{a}^{b} f'(x) \\,dx = f(x)\\Big|_{a}^{b} = f(b) - f(a)$\n\t\tThay các giá trị đã cho:\n\t\t$f(b) - f(a) = 5 - 2 = 3$.","choiceHash":"e70c2de5","tfHashes":[],"shortHash":""},{"id":"Q6","number":6,"type":"choice","stem":"Trong không gian $Oxyz$, cosin của góc giữa hai mặt phẳng $(P): 2x-y+2z-1=0$ và $(Q): x+y+z=0$ bằng","points":0.45,"required":true,"options":[{"label":"A","content":"$\\dfrac{\\sqrt{3}}{9}$"},{"label":"B","content":"$-\\dfrac{\\sqrt{3}}{3}$"},{"label":"C","content":"$\\dfrac{\\sqrt{3}}{3}$"},{"label":"D","content":"$\\dfrac{1}{3}$"}],"statements":[],"solutionHtml":"Mặt phẳng $(P)$ có vectơ pháp tuyến $\\vec{n_P} = (2; -1; 2)$.\n\t\tMặt phẳng $(Q)$ có vectơ pháp tuyến $\\vec{n_Q} = (1; 1; 1)$.\n\t\tCosin của góc $\\alpha$ giữa hai mặt phẳng $(P)$ và $(Q)$ được tính bằng công thức:\n\t\t$\\cos \\alpha = \\dfrac{|\\vec{n_P} \\cdot \\vec{n_Q}|}{|\\vec{n_P}| \\cdot |\\vec{n_Q}|}$\n\t\tTa có:\n\t\t$\\vec{n_P} \\cdot \\vec{n_Q} = 2 \\cdot 1 + (-1) \\cdot 1 + 2 \\cdot 1 = 2 - 1 + 2 = 3$.\n\t\t$|\\vec{n_P}| = \\sqrt{2^2 + (-1)^2 + 2^2} = \\sqrt{4 + 1 + 4} = \\sqrt{9} = 3$.\n\t\t$|\\vec{n_Q}| = \\sqrt{1^2 + 1^2 + 1^2} = \\sqrt{1 + 1 + 1} = \\sqrt{3}$.\n\t\tVậy, $\\cos \\alpha = \\dfrac{|3|}{3 \\cdot \\sqrt{3}} = \\dfrac{1}{\\sqrt{3}} = \\dfrac{\\sqrt{3}}{3}$.","choiceHash":"e60c2c52","tfHashes":[],"shortHash":""},{"id":"Q7","number":7,"type":"choice","stem":"Cho hàm số $f(x) = e^{2x-2} - 2x$. Giá trị lớn nhất, giá trị nhỏ nhất của hàm số đã cho trên đoạn $[0;2]$ lần lượt là:","points":0.45,"required":true,"options":[{"label":"A","content":"$e^2 - 4$ và $e^{-2}$"},{"label":"B","content":"$e^2$ và $-1$"},{"label":"C","content":"$-1$ và $e^{-2}$"},{"label":"D","content":"$e^2 - 4$ và $-1$"}],"statements":[],"solutionHtml":"Để tìm giá trị lớn nhất và nhỏ nhất của hàm số $f(x) = e^{2x-2} - 2x$ trên đoạn $[0;2]$, ta thực hiện các bước sau:\n\t\t<ol class=\"list-decimal pl-5 my-2 space-y-1\"><li>Tính đạo hàm $f'(x)$:\n\t\t\t$f'(x) = \\left(e^{2x-2} - 2x\\right)' = 2e^{2x-2} - 2$.</li><li>Tìm các điểm cực trị trên khoảng $(0;2)$ bằng cách giải $f'(x) = 0$:\n\t\t\t$2e^{2x-2} - 2 = 0 \\Leftrightarrow e^{2x-2} = 1 \\Leftrightarrow 2x-2 = 0 \\Leftrightarrow x = 1$.\n\t\t\tĐiểm $x = 1$ thuộc đoạn $[0;2]$.</li><li>Tính giá trị của hàm số tại các điểm đầu mút của đoạn và tại các điểm cực trị tìm được:\n\t\t\t$f(0) = e^{2(0)-2} - 2(0) = e^{-2} - 0 = \\dfrac{1}{e^2}$.\n\t\t\t$f(2) = e^{2(2)-2} - 2(2) = e^{2} - 4$.\n\t\t\t$f(1) = e^{2(1)-2} - 2(1) = e^0 - 2 = 1 - 2 = -1$.</li><li>So sánh các giá trị này để tìm giá trị lớn nhất và nhỏ nhất:\n\t\t\tTa có $\\dfrac{1}{e^2} \\approx 0,135$, $e^2 - 4 \\approx 7,389 - 4 = 3,389$, và $-1$.\n\t\t\tVậy, giá trị lớn nhất là $\\max_{[0;2]} f(x) = e^2 - 4$.\n\t\t\tGiá trị nhỏ nhất là $\\min_{[0;2]} f(x) = -1$.</li></ol>\n\t\tGiá trị lớn nhất và giá trị nhỏ nhất lần lượt là $e^2 - 4$ và $-1$.","choiceHash":"e10c2473","tfHashes":[],"shortHash":""},{"id":"Q8","number":8,"type":"choice","stem":"Hàm số nào sau đây đồng biến trên $\\mathbb{R}$?","points":0.45,"required":true,"options":[{"label":"A","content":"$y = x - x^3$"},{"label":"B","content":"$y = x^3 - 2x$"},{"label":"C","content":"$y = x^3 + x$"},{"label":"D","content":"$y = -x^3 - x$"}],"statements":[],"solutionHtml":"Xét hàm số $y = x^3 + x$.\n\t\tĐạo hàm: $y' = 3x^2 + 1$.\n\t\tVì $x^2 \\ge 0$ với mọi $x \\in \\mathbb{R}$, nên $3x^2 \\ge 0$.\n\t\tDo đó, $y' = 3x^2 + 1 \\ge 1 > 0$ với mọi $x \\in \\mathbb{R}$.\n\t\tVậy hàm số $y = x^3 + x$ đồng biến trên $\\mathbb{R}$.","choiceHash":"e60c2c52","tfHashes":[],"shortHash":""},{"id":"Q9","number":9,"type":"choice","stem":"Cho hàm số $f(x) = x^3 - 3x^2 + 1$. Gọi $y = ax + b$ là đường thẳng đi qua hai điểm cực trị của đồ thị hàm số $f(x)$ đã cho. Tính $a+b$.","points":0.45,"required":true,"options":[{"label":"A","content":"$1$"},{"label":"B","content":"$0$"},{"label":"C","content":"$2$"},{"label":"D","content":"$-1$"}],"statements":[],"solutionHtml":"Ta có $f(x) = x^3 - 3x^2 + 1$. <br/>\n\t\tĐạo hàm $f'(x) = 3x^2 - 6x$. <br/>\n\t\tCho $f'(x) = 0 \\Leftrightarrow 3x^2 - 6x = 0 \\Leftrightarrow 3x(x-2) = 0 \\Leftrightarrow \\left[ \\begin{array}{l} x=0 \\\\ x=2 \\end{array} \\right.$. <br/>\n\t\tCác điểm cực trị là: <br/>\n\t\tVới $x=0 \\Rightarrow y = f(0) = 0^3 - 3(0)^2 + 1 = 1$. Ta có điểm cực trị $A(0, 1)$. <br/>\n\t\tVới $x=2 \\Rightarrow y = f(2) = 2^3 - 3(2)^2 + 1 = 8 - 12 + 1 = -3$. Ta có điểm cực trị $B(2, -3)$. <br/>\n\t\tĐường thẳng $y = ax+b$ đi qua hai điểm $A(0, 1)$ và $B(2, -3)$. <br/>\n\t\tThay tọa độ điểm $A(0, 1)$ vào phương trình đường thẳng: $1 = a(0) + b \\Rightarrow b = 1$. <br/>\n\t\tThay tọa độ điểm $B(2, -3)$ vào phương trình đường thẳng: $-3 = a(2) + b$. <br/>\n\t\tVới $b=1$, ta có $-3 = 2a + 1 \\Rightarrow 2a = -4 \\Rightarrow a = -2$. <br/>\n\t\tVậy $a+b = -2 + 1 = -1$.","choiceHash":"e10c2473","tfHashes":[],"shortHash":""},{"id":"Q10","number":10,"type":"choice","stem":"Trong không gian $Oxyz$, cho mặt phẳng $(P) : x-\\dfrac{y}{2}+z=2$. Một vector pháp tuyến của mặt phẳng $(P)$ là","points":0.45,"required":true,"options":[{"label":"A","content":"$\\vec{n} = (1; 2; 1)$"},{"label":"B","content":"$\\vec{n} = (1; -2; 1)$"},{"label":"C","content":"$\\vec{n} = (2; 1; 2)$"},{"label":"D","content":"$\\vec{n} = (2; -1; 2)$"}],"statements":[],"solutionHtml":"Phương trình tổng quát của mặt phẳng $(P)$ là $Ax+By+Cz+D=0$.\n\t\tTừ phương trình $x-\\dfrac{y}{2}+z=2$, ta có thể viết lại là $x-\\dfrac{1}{2}y+z-2=0$.\n\t\tMột vector pháp tuyến của mặt phẳng $(P)$ có tọa độ là các hệ số của $x, y, z$, tức là $\\vec{n'} = (1; -\\dfrac{1}{2}; 1)$.\n\t\tĐể có các thành phần là số nguyên, ta có thể nhân vector này với $2$:\n\t\t$\\vec{n} = 2 \\cdot \\vec{n'} = 2 \\cdot (1; -\\dfrac{1}{2}; 1) = (2; -1; 2)$.","choiceHash":"e10c2473","tfHashes":[],"shortHash":""},{"id":"Q11","number":11,"type":"choice","stem":"Tập nghiệm của bất phương trình $\\log_{0,2} (x-2) > -1$ là:","points":0.45,"required":true,"options":[{"label":"A","content":"$(2; 7)$"},{"label":"B","content":"$(7; +\\infty)$"},{"label":"C","content":"$(2; \\dfrac{11}{5})$"},{"label":"D","content":"$(-\\infty; 7)$"}],"statements":[],"solutionHtml":"Điều kiện xác định: $x-2 > 0 \\Leftrightarrow x > 2$.\n\t\tVì cơ số $0,2 < 1$, bất phương trình tương đương với:\n\t\t$x-2 < (0,2)^{-1}$\n\t\t$x-2 < \\left(\\dfrac{1}{5}\\right)^{-1}$\n\t\t$x-2 < 5^1$\n\t\t$x-2 < 5$\n\t\t$x < 7$.\n\t\tKết hợp với điều kiện $x > 2$, ta được $2 < x < 7$.\n\t\tVậy tập nghiệm là $(2; 7)$.","choiceHash":"e40c292c","tfHashes":[],"shortHash":""},{"id":"Q12","number":12,"type":"choice","stem":"Trong không gian với hệ tọa độ $Oxyz$, phương trình mặt cầu $(S)$ có tâm $I(1;-2;3)$ và tiếp xúc với mặt phẳng $y=0$ là","points":0.45,"required":true,"options":[{"label":"A","content":"$(x-1)^2 + (y+2)^2 + (z-3)^2 = 9$"},{"label":"B","content":"$(x+1)^2 + (y-2)^2 + (z+3)^2 = 4$"},{"label":"C","content":"$(x-1)^2 + (y+2)^2 + (z-3)^2 = 2$"},{"label":"D","content":"$(x-1)^2 + (y+2)^2 + (z-3)^2 = 4$"}],"statements":[],"solutionHtml":"Mặt cầu $(S)$ có tâm $I(1;-2;3)$.\n\t\tMặt phẳng $y=0$ có phương trình tổng quát là $0x+1y+0z+0=0$.\n\t\tVì mặt cầu $(S)$ tiếp xúc với mặt phẳng $y=0$ nên bán kính $R$ của mặt cầu bằng khoảng cách từ tâm $I$ đến mặt phẳng $y=0$.\n\t\t$R = d(I, y=0) = \\dfrac{|0(1) + 1(-2) + 0(3) + 0|}{\\sqrt{0^2+1^2+0^2}} = \\dfrac{|-2|}{1} = 2$.\n\t\tPhương trình mặt cầu $(S)$ là: $(x - 1)^2 + (y - (-2))^2 + (z - 3)^2 = R^2$\n\t\t$\\Leftrightarrow (x-1)^2 + (y+2)^2 + (z-3)^2 = 2^2$\n\t\t$\\Leftrightarrow (x-1)^2 + (y+2)^2 + (z-3)^2 = 4$.","choiceHash":"e10c2473","tfHashes":[],"shortHash":""},{"id":"Q13","number":13,"type":"choiceTF","stem":"Một nhóm nhà khoa học tiến hành nghiên cứu một phương pháp xét nghiệm bệnh Z, người ta thấy rằng cứ 100 người trong cộng đồng thì có 20 người mắc bệnh Z. Biết rằng nếu một người có kết quả xét nghiệm là dương tính thì xác suất để người đó mắc bệnh Z là 0,9; nếu một người có kết quả xét nghiệm là âm tính thì xác suất để người đó mắc bệnh Z là 0,1.\n\t\n\tGọi A là biến cố: \"Một người trong cộng đồng mắc bệnh Z\"\n\t\n\tGọi B là biến cố: \"Một người trong cộng đồng có kết quả xét nghiệm dương tính với bệnh Z\"","points":0.45,"required":true,"options":[],"statements":[{"key":"a","label":"a","content":"$P(A) =0,2; P(\\overline{A}) =0,8$"},{"key":"b","label":"b","content":"$P(A|B) =0,1$"},{"key":"c","label":"c","content":"Xác suất để một người có kết quả xét nghiệm dương tính với bệnh Z là $0,25$"},{"key":"d","label":"d","content":"Trong số những người mắc bệnh Z, có 56\\% số người có kết quả xét nghiệm dương tính với bệnh Z (kết quả tính theo phần trăm, làm tròn đến hàng đơn vị)"}],"solutionHtml":"<div class=\"my-2.5 space-y-1.5\"><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">a)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Đúng. $P(A) = \\dfrac{20}{100} = 0,2 \\Rightarrow P(\\overline{A}) = 0,8$.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">b)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Sai. $P(A|B) = 0,9$.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">c)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Sai. Ta có $P(A|\\overline{B}) = 0,1$. Đặt $P(B) = x$. Ta có $P(A) = P(A|B).P(B) + P(A|\\overline{B}).P(\\overline{B}) \\Leftrightarrow 0,2 = 0,9.x + 0,1.(1-x) \\Leftrightarrow x = 0,125$.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">d)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Đúng. $P(B|A) = \\dfrac{P(B).P(A|B)}{P(A)} = \\dfrac{0,125.0,9}{0,2} = 0,5625 \\approx 56\\%$.</div>\n          </div></div>","choiceHash":"","tfHashes":["4db211e5","0b069958","0b069958","4db211e5"],"shortHash":""},{"id":"Q14","number":14,"type":"choiceTF","stem":"Trong không gian $Oxyz$, cho ba điểm $A(2;1;3)$, $B(3;0;2)$, $C(0;-2;1)$.","points":0.45,"required":true,"options":[],"statements":[{"key":"a","label":"a","content":"$\\overrightarrow{AB} = (1; -1; -1), \\overrightarrow{BC} = (-3;-2; -1)$"},{"key":"b","label":"b","content":"Đường thẳng $BC$ đi qua điểm $M(6;2;3)$"},{"key":"c","label":"c","content":"Khoảng cách từ điểm $A$ đến mặt phẳng trung trực của đoạn $BC$ bằng $\\dfrac{\\sqrt{15}}{2}$"},{"key":"d","label":"d","content":"Mặt phẳng $(P)$ đi qua hai điểm $A$, $B$ và cách $C$ một khoảng lớn nhất có phương trình $3x+2y+z-11=0$"}],"solutionHtml":"<div class=\"my-2.5 space-y-1.5\"><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">a)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Ta có $\\overrightarrow{AB} = (3-2; 0-1; 2-3) = (1; -1; -1)$ và $\\overrightarrow{BC} = (0-3; -2-0; 1-2) = (-3; -2; -1)$. Vậy đáp án A đúng.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">b)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Ta có $\\overrightarrow{BM} = (6-3; 2-0; 3-2) = (3; 2; 1)$ và $\\overrightarrow{BC} = (-3; -2; -1)$. Vì $\\overrightarrow{BM} = -1 \\cdot \\overrightarrow{BC}$ nên $B$, $C$, $M$ thẳng hàng. Vậy đường thẳng $BC$ đi qua điểm $M(6;2;3)$. Do đó, đáp án B đúng.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">c)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Gọi $I$ là trung điểm của $BC$. Khi đó $I\\left(\\dfrac{3+0}{2}; \\dfrac{0-2}{2}; \\dfrac{2+1}{2}\\right) = \\left(\\dfrac{3}{2}; -1; \\dfrac{3}{2}\\right)$. Mặt phẳng trung trực của $BC$ đi qua $I$ và có vector pháp tuyến là $\\overrightarrow{BC} = (-3; -2; -1)$. Phương trình mặt phẳng trung trực của $BC$ là $-3\\left(x-\\dfrac{3}{2}\\right) - 2(y+1) - \\left(z-\\dfrac{3}{2}\\right) = 0 \\Leftrightarrow -3x - 2y - z + 4 = 0 \\Leftrightarrow 3x + 2y + z - 4 = 0$. Khoảng cách từ $A(2;1;3)$ đến mặt phẳng này là $d(A, (Q)) = \\dfrac{|3\\cdot 2 + 2\\cdot 1 + 3 - 4|}{\\sqrt{3^2 + 2^2 + 1^2}} = \\dfrac{|6+2+3-4|}{\\sqrt{14}} = \\dfrac{7}{\\sqrt{14}} = \\dfrac{\\sqrt{14}}{2} \\neq \\dfrac{\\sqrt{15}}{2}$. Vậy đáp án C sai.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">d)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Ta có $\\overrightarrow{AB} = (1; -1; -1)$ và $\\overrightarrow{BC} = (-3; -2; -1)$. Khi đó $\\overrightarrow{AB} \\cdot \\overrightarrow{BC} = 1\\cdot (-3) + (-1)\\cdot (-2) + (-1)\\cdot (-1) = -3 + 2 + 1 = 0$. Suy ra $\\overrightarrow{AB} \\perp \\overrightarrow{BC}$. Gọi $K$ là hình chiếu của $C$ trên mặt phẳng $(P)$. Khi đó $d(C, (P)) = CK \\leq CB$. Do đó khoảng cách từ $C$ đến mặt phẳng $(P)$ lớn nhất bằng $CB$ khi $K \\equiv B$. Khi đó $\\overrightarrow{BC} \\perp (P)$. Vậy mặt phẳng $(P)$ đi qua $A(2;1;3)$ và có một vector pháp tuyến là $\\overrightarrow{BC} = (-3; -2; -1)$. Phương trình mặt phẳng $(P)$ là $-3(x-2) - 2(y-1) - (z-3) = 0 \\Leftrightarrow -3x - 2y - z + 11 = 0 \\Leftrightarrow 3x + 2y + z - 11 = 0$. Vậy đáp án D đúng.</div>\n          </div></div>","choiceHash":"","tfHashes":["4db211e5","0b069958","0b069958","4db211e5"],"shortHash":""},{"id":"Q15","number":15,"type":"choiceTF","stem":"Một vật đang chuyển động với vận tốc $v_0 = 15m/s$ thì tăng tốc với gia tốc $a(t) = t^2 + 4t \\ (m/s^2)$.","points":0.45,"required":true,"options":[],"statements":[{"key":"a","label":"a","content":"$v(t)$ là vận tốc của vật ở thời điểm $t$ thì $v(t)$ là một nguyên hàm của $a(t) = t^2 + 4t$"},{"key":"b","label":"b","content":"$v(t) = \\dfrac{t^3}{3} + 2t^2 + 12$"},{"key":"c","label":"c","content":"Vận tốc của vật tại thời điểm $t = 3(s)$ là $21 \\ (m/s)$"},{"key":"d","label":"d","content":"Quãng đường vật đi được trong $4(s)$ đầu tiên kể từ lúc bắt đầu tăng tốc là $124 \\ (m)$"}],"solutionHtml":"<div class=\"my-2.5 space-y-1.5\"><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">a)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">$v(t)$ là một nguyên hàm của $a(t) = t^2 + 4t$ là đúng.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">b)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Ta có $v(t) = \\displaystyle \\int (t^2 + 4t) dt = \\dfrac{t^3}{3} + 2t^2 + C$. Vì $v(0) = 15$ nên $C = 15$. Vậy $v(t) = \\dfrac{t^3}{3} + 2t^2 + 15 \\neq \\dfrac{t^3}{3} + 2t^2 + 12$.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">c)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Vận tốc của vật tại thời điểm $t = 3(s)$ là $v(3) = \\dfrac{3^3}{3} + 2 \\cdot 3^2 + 15 = 9 + 18 + 15 = 42 \\ (m/s) \\neq 21 \\ (m/s)$.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">d)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Quãng đường vật đi được trong $4(s)$ đầu tiên kể từ lúc bắt đầu tăng tốc là:\n\t\t\t$S = \\displaystyle \\int_0^4 \\left( \\dfrac{t^3}{3} + 2t^2 + 15 \\right) dt = \\left. \\left( \\dfrac{t^4}{12} + \\dfrac{2t^3}{3} + 15t \\right) \\right|_0^4 = \\dfrac{4^4}{12} + \\dfrac{2 \\cdot 4^3}{3} + 15 \\cdot 4 = \\dfrac{64}{3} + \\dfrac{128}{3} + 60 = \\dfrac{192}{3} + 60 = 64 + 60 = 124 \\ (m)$.</div>\n          </div></div>","choiceHash":"","tfHashes":["4db211e5","0b069958","0b069958","4db211e5"],"shortHash":""},{"id":"Q16","number":16,"type":"choiceTF","stem":"Cho hàm số $f(x) = e^{2x} - 2x - 1$.","points":0.45,"required":true,"options":[],"statements":[{"key":"a","label":"a","content":"$f(0) = 0; f\\left(\\dfrac{1}{2}\\right) = e - 2$"},{"key":"b","label":"b","content":"Đạo hàm của hàm số đã cho là $f'(x) = e^x - 2$"},{"key":"c","label":"c","content":"Hàm số $f(x)$ đồng biến trong khoảng $(1;2)$"},{"key":"d","label":"d","content":"Giá trị nhỏ nhất của hàm số $f(x)$ trên đoạn $\\left[\\dfrac{1}{2}; \\dfrac{3}{2}\\right]$ là $e - 2$"}],"solutionHtml":"<div class=\"my-2.5 space-y-1.5\"><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">a)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">Xét $f(x) = e^{2x} - 2x - 1$. Ta có $f(0) = e^0 - 0 - 1 = 1 - 1 = 0$.  $f\\left(\\dfrac{1}{2}\\right) = e^{2 \\cdot \\frac{1}{2}} - 2 \\cdot \\frac{1}{2} - 1 = e - 1 - 1 = e - 2$. Vậy a) đúng.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">b)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">$f'(x) = 2e^{2x} - 2$. Vậy b) sai.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">c)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">$f'(x) = 2e^{2x} - 2 > 0 \\Leftrightarrow e^{2x} > 1 \\Leftrightarrow 2x > 0 \\Leftrightarrow x > 0$. Vậy hàm số đồng biến trên $(0; +\\infty)$. Do đó hàm số đồng biến trên $(1;2)$. Vậy c) đúng.</div>\n          </div><div class=\"p-2.5 rounded-lg bg-white/90 border border-slate-200 flex items-start gap-2\">\n            <span class=\"px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-extrabold text-xs shrink-0\">d)</span>\n            <div class=\"flex-1 min-w-0 break-words leading-relaxed\">$f'(x) = 2e^{2x} - 2 = 0 \\Leftrightarrow e^{2x} = 1 \\Leftrightarrow x = 0 \\notin \\left[\\dfrac{1}{2}; \\dfrac{3}{2}\\right]$.<br/>\n\t\t\t$f\\left(\\dfrac{1}{2}\\right) = e - 2$.<br/>\n\t\t\t$f\\left(\\dfrac{3}{2}\\right) = e^3 - 4 \\approx 16.08 > e - 2$. Vậy giá trị nhỏ nhất của hàm số trên đoạn $\\left[\\dfrac{1}{2}; \\dfrac{3}{2}\\right]$ là $e - 2$. Vậy d) đúng.</div>\n          </div></div>","choiceHash":"","tfHashes":["4db211e5","0b069958","4db211e5","4db211e5"],"shortHash":""},{"id":"Q17","number":17,"type":"shortans","stem":"Trong không gian ba chiều $Oxyz$, nhà bác An muốn lắp đường dây cáp truyền hình cho ba vị trí $A, B, C$ có tọa độ được xác định như sau:\n\tVị trí $A$ có tọa độ $A(4;6;0)$ nằm trên mặt đất.\n\tVị trí $B$ có tọa độ $B(5;8;4)$ nằm trên tầng hai tòa nhà và ở độ cao $4m$.\n\tVị trí $C$ có tọa độ $C(6;4;9)$ nằm trên tầng ba tòa nhà và ở độ cao $9m$.\n\tBác An muốn lắp đặt máy chủ tại địa điểm là $D(a;b;c)$ sao cho khoảng cách từ $D$ đến ba vị trí kể trên là bằng nhau và chi phí đường dây là ít nhất. Biết rằng một mét dây cáp giá $200$ nghìn đồng.\n\tSố tiền bác An chi phí mua dây để kết nối đến ba vị trí trên ít nhất là bao nhiêu nghìn? (Làm tròn kết quả đến hàng đơn vị)","points":0.45,"required":true,"options":[],"statements":[],"solutionHtml":"Điểm $D$ cách đều 3 điểm $A, B, C$.\n\t\t$\\Rightarrow$ điểm $D$ thuộc trục của đường ngoại tiếp tam giác $ABC$.\n\t\tVà khoảng cách từ $D$ đến 3 điểm $A, B, C$ nhỏ nhất $\\Leftrightarrow D$ là tâm đường tròn ngoại tiếp $\\triangle ABC$.\n\t\tTa có:\n\t\t$\\overrightarrow{AB} = (5-4; 8-6; 4-0) = (1;2;4) \\Rightarrow AB = \\sqrt{1^2+2^2+4^2} = \\sqrt{1+4+16} = \\sqrt{21}$.\n\t\t$\\overrightarrow{AC} = (6-4; 4-6; 9-0) = (2;-2;9) \\Rightarrow AC = \\sqrt{2^2+(-2)^2+9^2} = \\sqrt{4+4+81} = \\sqrt{89}$.\n\t\t$\\overrightarrow{BC} = (6-5; 4-8; 9-4) = (1;-4;5) \\Rightarrow BC = \\sqrt{1^2+(-4)^2+5^2} = \\sqrt{1+16+25} = \\sqrt{42}$.\n\t\t\n\t\tDiện tích tam giác $ABC$ $S = \\dfrac{1}{2} \\left| \\left[ \\overrightarrow{AB}, \\overrightarrow{AC} \\right] \\right|$.\n\t\tTa tính tích có hướng:\n\t\t$\\left[ \\overrightarrow{AB}, \\overrightarrow{AC} \\right] = \\left( \\left| \\begin{matrix} 2 & 4 \\\\ -2 & 9 \\end{matrix} \\right|; \\left| \\begin{matrix} 4 & 1 \\\\ 9 & 2 \\end{matrix} \\right|; \\left| \\begin{matrix} 1 & 2 \\\\ 2 & -2 \\end{matrix} \\right| \\right)$\n\t\t$= (2 \\cdot 9 - 4 \\cdot (-2); 4 \\cdot 2 - 1 \\cdot 9; 1 \\cdot (-2) - 2 \\cdot 2)$\n\t\t$= (18+8; 8-9; -2-4) = (26; -1; -6)$.\n\t\tĐộ lớn của tích có hướng:\n\t\t$\\left| \\left[ \\overrightarrow{AB}, \\overrightarrow{AC} \\right] \\right| = \\sqrt{26^2 + (-1)^2 + (-6)^2} = \\sqrt{676 + 1 + 36} = \\sqrt{713}$.\n\t\tVậy $S = \\dfrac{\\sqrt{713}}{2}$.\n\t\t\n\t\tBán kính đường tròn ngoại tiếp $R$ của tam giác $ABC$ được tính bằng công thức $R = \\frac{abc}{4S}$, trong đó $a, b, c$ là độ dài các cạnh $BC, AC, AB$ tương ứng.\n\t\t$R = \\dfrac{AB \\cdot AC \\cdot BC}{4S} = \\dfrac{\\sqrt{21} \\cdot \\sqrt{89} \\cdot \\sqrt{42}}{4 \\cdot \\dfrac{\\sqrt{713}}{2}} = \\dfrac{\\sqrt{21 \\cdot 89 \\cdot 42}}{2\\sqrt{713}} = \\dfrac{\\sqrt{78498}}{2\\sqrt{713}}$.\n\t\t$R \\approx \\dfrac{280.1749}{2 \\cdot 26.7020} \\approx \\dfrac{280.1749}{53.404} \\approx 5.2463$.\n\t\t\n\t\tKhoảng cách từ $D$ đến ba vị trí $A, B, C$ là $R$.\n\t\tTổng chiều dài dây cáp cần thiết để kết nối $D$ đến ba vị trí là $3R$.\n\t\tChi phí mua dây là $T = 3R \\cdot 200$ (nghìn đồng).\n\t\t$T = 3 \\cdot 5.2463 \\cdot 200 = 15.7389 \\cdot 200 = 3147.78$ (nghìn đồng).\n\t\tLàm tròn kết quả đến hàng đơn vị, ta được $T \\approx 3148$ nghìn đồng.","choiceHash":"","tfHashes":[],"shortHash":"9eb78e2d"},{"id":"Q18","number":18,"type":"shortans","stem":"Một học sinh ôn thi tốt nghiệp và ghi nhớ toàn bộ nội dung một bài học vào ngày đầu tiên. Giả sử lượng kiến thức còn nhớ sau $t$ ngày (khi chưa ôn tập lại) của học sinh này được xác định bởi công thức $R(t) = 100e^{-0,3t}$, $R(t)$ phần trăm. Hỏi sau bao nhiêu ngày thì lượng kiến thức còn nhớ là $30\\%$? (làm tròn kết quả đến hàng đơn vị).","points":0.45,"required":true,"options":[],"statements":[],"solutionHtml":"Do lượng kiến thức còn nhớ là $30\\%$ nên $R(t) = 30$.\n\t\tTa có phương trình:\n\t\t$100e^{-0,3t} = 30$\n\t\t$e^{-0,3t} = \\dfrac{30}{100}$\n\t\t$e^{-0,3t} = \\dfrac{3}{10}$\n\t\tLấy logarit tự nhiên hai vế:\n\t\t$\\ln(e^{-0,3t}) = \\ln\\left(\\dfrac{3}{10}\\right)$\n\t\t$-0,3t = \\ln\\left(\\dfrac{3}{10}\\right)$\n\t\t$t = \\dfrac{\\ln\\left(\\dfrac{3}{10}\\right)}{-0,3}$\n\t\t$t \\approx \\dfrac{-1,20397}{-0,3}$\n\t\t$t \\approx 4,0132$\n\t\tLàm tròn kết quả đến hàng đơn vị, ta được $t \\approx 4$.\n\t\tVậy sau 4 ngày lượng kiến thức còn nhớ là $30\\%$.","choiceHash":"","tfHashes":[],"shortHash":"310ca263"},{"id":"Q19","number":19,"type":"shortans","stem":"@@IMMINI_LEFT@@Một chiếc đinh tán bằng thép có dạng khối tròn xoay được tạo thành khi cho phần tô đậm quanh cạnh $AB$. Biết $ABCD$ là hình chữ nhật có $AB=30 \\text{ mm}$, $AD=5 \\text{ mm}$, cung $AE$ là một phần tư của đường tròn có bán kính bằng $5 \\text{ mm}$, và $BG=2 \\text{ mm}$. Tính khối lượng thép cần dùng để sản xuất $1000$ chiếc đinh tán, biết khối lượng riêng của thép là $7850 \\text{ kg/m}^3$ (làm tròn kết quả đến hàng phần mười, đơn vị: kg).","points":0.45,"required":true,"options":[],"statements":[],"solutionHtml":"Để tính khối lượng thép cần dùng, ta cần tính thể tích của một chiếc đinh tán, sau đó nhân với số lượng đinh tán và khối lượng riêng của thép.\n\t\t\n\t\t<strong>1. Xác định hình dạng và kích thước của vùng tô đậm:</strong>\n\t\tĐặt hệ trục tọa độ với gốc $B$ tại $(0,0)$, cạnh $AB$ nằm trên trục $Oy$.\n\t\tKhi đó, các điểm có tọa độ như sau:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>$B = (0,0)$</li><li>$A = (0,30)$ (vì $AB=30 \\text{ mm}$)</li><li>$C = (5,0)$ (vì $BC=AD=5 \\text{ mm}$)</li><li>$D = (5,30)$</li><li>$G = (2,0)$ (vì $BG=2 \\text{ mm}$)</li></ul>\n\t\tCung $AE$ là một phần tư của đường tròn có bán kính $R=5 \\text{ mm}$.\n\t\tTừ hình vẽ, cung $AE$ có tâm là $O'=(0,25)$.\n\t\tKiểm tra:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>Khoảng cách từ $O'(0,25)$ đến $A(0,30)$ là $\\sqrt{(0-0)^2 + (30-25)^2} = \\sqrt{0^2 + 5^2} = 5 \\text{ mm}$.</li><li>Khoảng cách từ $O'(0,25)$ đến $E(5,25)$ là $\\sqrt{(5-0)^2 + (25-25)^2} = \\sqrt{5^2 + 0^2} = 5 \\text{ mm}$.</li></ul>\n\t\tVậy, tâm của cung $AE$ là $(0,25)$ và bán kính là $5 \\text{ mm}$. Phương trình của đường tròn chứa cung $AE$ là $x^2 + (y-25)^2 = 5^2$.\n\t\tTừ đó, $x = \\sqrt{25 - (y-25)^2}$ (vì $x \\ge 0$).\n\t\t\n\t\tVùng tô đậm được giới hạn bởi các đường:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>Trục $Oy$ ($x=0$)</li><li>Đoạn $BG$ trên trục $Ox$ ($y=0$, từ $x=0$ đến $x=2$)</li><li>Đoạn $GF$ ($x=2$, từ $y=0$ đến $y=25$)</li><li>Đoạn $FE$ ($y=25$, từ $x=2$ đến $x=5$)</li><li>Cung $AE$ ($x = \\sqrt{25 - (y-25)^2}$, từ $y=25$ đến $y=30$)</li></ul>\n\t\t\n\t\t<strong>2. Tính thể tích một chiếc đinh tán ($V_\\text{đinh tán}$):</strong>\n\t\tKhối tròn xoay được tạo thành khi quay vùng tô đậm quanh cạnh $AB$ (trục $Oy$). Ta sử dụng phương pháp đĩa (disk method).\n\t\tThể tích được chia thành hai phần:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li><strong>Phần 1:</strong> Khi $y$ chạy từ $0$ đến $25 \\text{ mm}$. Bán kính của đĩa là $x=2 \\text{ mm}$.\n\t\t\t$V_1 = \\displaystyle\\int_0^{25} \\pi x^2 dy = \\displaystyle\\int_0^{25} \\pi (2)^2 dy = \\displaystyle\\int_0^{25} 4\\pi dy = 4\\pi [y]_0^{25} = 4\\pi (25 - 0) = 100\\pi \\text{ mm}^3$.</li><li><strong>Phần 2:</strong> Khi $y$ chạy từ $25$ đến $30 \\text{ mm}$. Bán kính của đĩa là $x = \\sqrt{25 - (y-25)^2}$.\n\t\t\t$V_2 = \\displaystyle\\int_{25}^{30} \\pi x^2 dy = \\displaystyle\\int_{25}^{30} \\pi \\left(\\sqrt{25 - (y-25)^2}\\right)^2 dy = \\pi \\displaystyle\\int_{25}^{30} (25 - (y-25)^2) dy$.\n\t\t\tĐặt $u = y-25$, suy ra $du = dy$.\n\t\t\tKhi $y=25$, $u=0$. Khi $y=30$, $u=5$.\n\t\t\t$V_2 = \\pi \\displaystyle\\int_0^5 (25 - u^2) du = \\pi \\left[25u - \\dfrac{u^3}{3}\\right]_0^5$.\n\t\t\t$V_2 = \\pi \\left( \\left(25(5) - \\dfrac{5^3}{3}\\right) - \\left(25(0) - \\dfrac{0^3}{3}\\right) \\right)$.\n\t\t\t$V_2 = \\pi \\left(125 - \\dfrac{125}{3}\\right) = \\pi \\left(\\dfrac{375 - 125}{3}\\right) = \\dfrac{250\\pi}{3} \\text{ mm}^3$.</li></ul>\n\t\tTổng thể tích của một chiếc đinh tán là:\n\t\t$V_\\text{đinh tán} = V_1 + V_2 = 100\\pi + \\dfrac{250\\pi}{3} = \\dfrac{300\\pi + 250\\pi}{3} = \\dfrac{550\\pi}{3} \\text{ mm}^3$.\n\t\t\n\t\t<strong>3. Chuyển đổi đơn vị thể tích:</strong>\n\t\t$1 \\text{ mm} = 10^{-3} \\text{ m}$.\n\t\t$1 \\text{ mm}^3 = (10^{-3} \\text{ m})^3 = 10^{-9} \\text{ m}^3$.\n\t\t$V_\\text{đinh tán} = \\dfrac{550\\pi}{3} \\times 10^{-9} \\text{ m}^3$.\n\t\t\n\t\t<strong>4. Tính tổng thể tích thép cần dùng cho 1000 chiếc đinh tán:</strong>\n\t\t$V_{tổng} = 1000 \\times V_\\text{đinh tán} = 1000 \\times \\dfrac{550\\pi}{3} \\times 10^{-9} \\text{ m}^3 = \\dfrac{550\\pi}{3} \\times 10^{-6} \\text{ m}^3$.\n\t\t\n\t\t<strong>5. Tính khối lượng thép cần dùng:</strong>\n\t\tKhối lượng riêng của thép là $\\rho = 7850 \\text{ kg/m}^3$.\n\t\tKhối lượng $m = \\rho \\times V_\\text{tổng}$.\n\t\t$m = 7850 \\text{ kg/m}^3 \\times \\dfrac{550\\pi}{3} \\times 10^{-6} \\text{ m}^3$.\n\t\t$m = \\dfrac{7850 \\times 550 \\times \\pi}{3 \\times 10^6} = \\dfrac{4317500 \\pi}{3 \\times 10^6} \\text{ kg}$.\n\t\t$m = \\dfrac{4.3175 \\pi}{3} \\text{ kg}$.\n\t\tSử dụng giá trị $\\pi \\approx 3.14159265$:\n\t\t$m \\approx \\dfrac{4.3175 \\times 3.14159265}{3} \\approx \\dfrac{13.5698006}{3} \\approx 4.5232668 \\text{ kg}$.\n\t\t\n\t\t<strong>6. Làm tròn kết quả:</strong>\n\t\tLàm tròn đến hàng phần mười, ta được $m \\approx 4.5 \\text{ kg}$.\n\t\t\n\t\tVậy, khối lượng thép cần dùng là $4.5 \\text{ kg}$.","choiceHash":"","tfHashes":[],"shortHash":"a120f026"},{"id":"Q20","number":20,"type":"shortans","stem":"Cho hình chóp $S.ABC$ có đáy $ABC$ là tam giác vuông cân tại $A$, $AB=6$, $\\widehat{SBA}=\\widehat{SCA}=90^\\circ$, góc giữa hai mặt phẳng $(SAB)$ và $(SAC)$ bằng $60^\\circ$. Thể tích của khối chóp $S.ABC$ bằng bao nhiêu?","points":0.45,"required":true,"options":[],"statements":[],"solutionHtml":"Gọi $D$ là hình chiếu của $S$ lên $(ABC)$. Khi đó:\n\t\t$\\left.\\begin{array}{l} AB \\perp SB \\\\ AB \\perp SD \\end{array}\\right\\} \\Rightarrow AB \\perp (SBD) \\Rightarrow AB \\perp BD.$\n\t\tTương tự: $AC \\perp SC$ và $AC \\perp SD \\Rightarrow AC \\perp (SCD) \\Rightarrow AC \\perp CD$.\n\t\tVì $\\triangle ABC$ vuông cân tại $A$ nên $AB \\perp AC$.\n\t\tTa có $AB \\perp BD$ và $AC \\perp CD$.\n\t\tVì $AB \\perp BD$ và $AB \\perp AC$ nên $BD \\parallel AC$.\n\t\tVì $AC \\perp CD$ và $AC \\perp AB$ nên $CD \\parallel AB$.\n\t\tDo đó $ABDC$ là hình bình hành. Mà $AB \\perp AC$ nên $ABDC$ là hình chữ nhật.\n\t\tLại có $AB=AC=6$ nên $ABDC$ là hình vuông.\n\t\tSuy ra $BD=CD=6$.\n\t\tGọi $H, K$ lần lượt là hình chiếu của $D$ lên $SB, SC$.\n\t\tTa có:\n\t\t$\\left.\\begin{array}{l} AB \\perp (SBD) \\\\ DH \\subset (SBD) \\end{array}\\right\\} \\Rightarrow AB \\perp DH \\quad \\text{mà } DH \\perp SB \\Rightarrow DH \\perp (SAB).$\n\t\tTương tự: $AC \\perp (SCD) \\Rightarrow AC \\perp DK \\quad \\text{mà } DK \\perp SC \\Rightarrow DK \\perp (SAC).$\n\t\tVậy góc giữa hai mặt phẳng $(SAB)$ và $(SAC)$ là góc giữa hai đường thẳng $DH$ và $DK$.\n\t\tDo đó $\\cos((SAB), (SAC)) = |\\cos \\widehat{HDK}|$.\n\t\tTheo đề bài, góc giữa hai mặt phẳng $(SAB)$ và $(SAC)$ bằng $60^\\circ$, nên $|\\cos \\widehat{HDK}| = \\cos 60^\\circ = \\dfrac{1}{2}$.\n\t\t\n\t\tĐặt $SD=x$ ($x>0$).\n\t\tTrong $\\triangle SBD$ vuông tại $D$: $SB = \\sqrt{SD^2+BD^2} = \\sqrt{x^2+6^2} = \\sqrt{x^2+36}$.\n\t\t$DH$ là đường cao của $\\triangle SBD$: $DH = \\dfrac{SD \\cdot BD}{SB} = \\dfrac{x \\cdot 6}{\\sqrt{x^2+36}} = \\dfrac{6x}{\\sqrt{x^2+36}}$.\n\t\tTương tự, trong $\\triangle SCD$ vuông tại $D$: $SC = \\sqrt{SD^2+CD^2} = \\sqrt{x^2+6^2} = \\sqrt{x^2+36}$.\n\t\t$DK$ là đường cao của $\\triangle SCD$: $DK = \\dfrac{SD \\cdot CD}{SC} = \\frac{x \\cdot 6}{\\sqrt{x^2+36}} = \\dfrac{6x}{\\sqrt{x^2+36}}$.\n\t\tVậy $DH=DK$.\n\t\t\n\t\tTrong $\\triangle SBD$ vuông tại $D$, $BH$ là hình chiếu của $BD$ lên $SB$:\n\t\t$BH = \\sqrt{BD^2 - DH^2} = \\sqrt{6^2 - \\left(\\dfrac{6x}{\\sqrt{x^2+36}}\\right)^2} = \\sqrt{36 - \\dfrac{36x^2}{x^2+36}} = \\sqrt{\\dfrac{36(x^2+36)-36x^2}{x^2+36}} = \\sqrt{\\dfrac{36^2}{x^2+36}} = \\dfrac{36}{\\sqrt{x^2+36}}$.\n\t\tTương tự $CK = \\dfrac{36}{\\sqrt{x^2+36}}$.\n\t\tVì $SB=SC$ và $BH=CK$ nên $\\triangle SHK$ đồng dạng với $\\triangle SBC$.\n\t\tTa có $BC = \\sqrt{AB^2+AC^2} = \\sqrt{6^2+6^2} = 6\\sqrt{2}$.\n\t\t$\\dfrac{HK}{BC} = \\dfrac{SH}{SB} = \\dfrac{SB-BH}{SB} = 1 - \\dfrac{BH}{SB} = 1 - \\dfrac{36/\\sqrt{x^2+36}}{\\sqrt{x^2+36}} = 1 - \\dfrac{36}{x^2+36} = \\dfrac{x^2+36-36}{x^2+36} = \\dfrac{x^2}{x^2+36}$.\n\t\tVậy $HK = \\dfrac{x^2}{x^2+36} \\cdot BC = \\dfrac{x^2}{x^2+36} \\cdot 6\\sqrt{2} = \\dfrac{6\\sqrt{2}x^2}{x^2+36}$.\n\t\t\n\t\tÁp dụng định lý cosin trong $\\triangle HDK$:\n\t\t$\\cos \\widehat{HDK} = \\dfrac{DH^2+DK^2-HK^2}{2 \\cdot DH \\cdot DK}$.\n\t\tVì $DH=DK$, ta có $\\cos \\widehat{HDK} = \\frac{2DH^2-HK^2}{2DH^2} = 1 - \\dfrac{HK^2}{2DH^2}$.\n\t\tTa có $DH^2 = \\dfrac{36x^2}{x^2+36}$ và $HK^2 = \\left(\\dfrac{6\\sqrt{2}x^2}{x^2+36}\\right)^2 = \\dfrac{72x^4}{(x^2+36)^2}$.\n\t\t$\\dfrac{HK^2}{2DH^2} = \\dfrac{72x^4/(x^2+36)^2}{2 \\cdot 36x^2/(x^2+36)} = \\dfrac{72x^4}{(x^2+36)^2} \\cdot \\dfrac{x^2+36}{72x^2} = \\dfrac{x^2}{x^2+36}$.\n\t\tDo đó, $|\\cos \\widehat{HDK}| = \\left|1 - \\frac{x^2}{x^2+36}\\right| = \\left|\\dfrac{x^2+36-x^2}{x^2+36}\\right| = \\left|\\dfrac{36}{x^2+36}\\right|$.\n\t\tVì $x>0$, $x^2+36 > 0$, nên $\\dfrac{36}{x^2+36} = \\dfrac{1}{2}$.\n\t\t$x^2+36 = 72 \\Rightarrow x^2 = 36 \\Rightarrow x=6$ (vì $x>0$).\n\t\tVậy $SD=6$.\n\t\t\n\t\tDiện tích đáy $ABC$: $S_{ABC} = \\dfrac{1}{2} \\cdot AB \\cdot AC = \\dfrac{1}{2} \\cdot 6 \\cdot 6 = 18$.\n\t\tThể tích khối chóp $S.ABC$: $V_{S.ABC} = \\dfrac{1}{3} \\cdot SD \\cdot S_{ABC} = \\dfrac{1}{3} \\cdot 6 \\cdot 18 = 36$.","choiceHash":"","tfHashes":[],"shortHash":"89f0549c"},{"id":"Q21","number":21,"type":"shortans","stem":"Một hộ làm nghề dệt vải lụa tơ tằm mỗi ngày sản xuất được $x$ mét vải lụa ($1 \\le x \\le 19$). Tổng chi phí sản xuất $x$ mét vải lụa cho bởi công thức $C(x) = \\dfrac{x^3}{3} + 4x^2 + 200$ (nghìn đồng). Giá bán của một mét vải lụa là 240 nghìn đồng và giả sử hộ luôn bán hết số sản phẩm trong ngày. Để đạt lợi nhuận tối đa thì mỗi ngày hộ cần sản xuất bao nhiêu mét vải lụa?","points":0.45,"required":true,"options":[],"statements":[],"solutionHtml":"Lợi nhuận thu được trong 1 ngày của hộ làm nghề dệt vải lụa tơ tằm là:\n\t\t$L(x) = 240x - C(x) = 240x - \\left(\\dfrac{x^3}{3} + 4x^2 + 200\\right) = -\\dfrac{x^3}{3} - 4x^2 + 240x - 200$, ($1 \\le x \\le 19$).\n\t\tĐạo hàm của hàm lợi nhuận là:\n\t\t$L'(x) = -x^2 - 8x + 240$.\n\t\tĐể tìm điểm cực trị, ta giải phương trình $L'(x) = 0$:\n\t\t$L'(x) = 0 \\Rightarrow -x^2 - 8x + 240 = 0$\n\t\tGiải phương trình bậc hai này, ta được:\n\t\t$\\left[ \\begin{array}{l} x=12 \\in [1; 19] \\\\ x=-20 \\notin [1; 19] \\end{array} \\right.$\n\t\tLập bảng biến thiên (BBT) của hàm $L(x)$ trên đoạn $[1; 19]$:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>$L'(x) > 0$ khi $x \\in [1; 12)$, suy ra $L(x)$ đồng biến trên $[1; 12)$.</li><li>$L'(x) < 0$ khi $x \\in (12; 19]$, suy ra $L(x)$ nghịch biến trên $(12; 19]$.</li></ul>\n\t\tVậy hàm $L(x)$ đạt giá trị lớn nhất tại $x=12$.\n\t\tTừ BBT, để đạt lợi nhuận tối đa thì mỗi ngày hộ cần sản xuất 12 mét vải lụa.","choiceHash":"","tfHashes":[],"shortHash":"1deb2d6a"},{"id":"Q22","number":22,"type":"shortans","stem":"An, Bình và Cao dự định tham gia xem một triển lãm tranh. Khả năng mỗi người đi phụ thuộc vào các yếu tố sau:\n\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>An: Việc An đi xem triển lãm phụ thuộc hoàn toàn vào thời tiết. Nếu trời không mưa, An có $75\\%$ khả năng đi xem triển lãm. Nếu trời mưa, khả năng này giảm xuống còn $40\\%$. Theo dự báo thời tiết, khả năng trời mưa trong ngày diễn ra triển lãm là $25\\%$.</li><li>Bình: Việc Bình đi xem triển lãm phụ thuộc hoàn toàn vào việc An có đi hay không. Nếu An đi, Bình có $90\\%$ khả năng đi. Nếu An không đi thì chắc chắn Bình sẽ không đi.</li><li>Cao: Khả năng Cao đi xem triển lãm không phụ thuộc các yếu tố khác. Cao có $50\\%$ khả năng đi xem triển lãm.</li></ul>\n\tXác suất để ít nhất hai trong ba người bạn cùng đi xem triển lãm là bao nhiêu? (làm tròn kết quả đến hàng phần trăm)","points":0.45,"required":true,"options":[],"statements":[],"solutionHtml":"Xét các biến cố:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>$T$: \"Trời mưa\"</li><li>$A$: \"An đi xem triển lãm tranh\"</li><li>$B$: \"Bình đi xem triển lãm tranh\"</li><li>$C$: \"Cao đi xem triển lãm tranh\"</li></ul>\n\t\tTheo đề bài, ta có các xác suất sau:\n\t\t$P(T) = 0,25 \\Rightarrow P(\\bar{T}) = 1 - P(T) = 1 - 0,25 = 0,75$.\n\t\t$P(A|T) = 0,4$ (An đi nếu trời mưa).\n\t\t$P(A|\\bar{T}) = 0,75$ (An đi nếu trời không mưa).\n\t\t$P(B|A) = 0,9$ (Bình đi nếu An đi).\n\t\t$P(B|\\bar{A}) = 0$ (Bình không đi nếu An không đi).\n\t\t$P(C) = 0,5$ (Cao đi, độc lập với các yếu tố khác).\n\t\t\n\t\tXác suất An đi xem triển lãm tranh:\n\t\t$P(A) = P(T) \\cdot P(A|T) + P(\\bar{T}) \\cdot P(A|\\bar{T})$\n\t\t$P(A) = 0,25 \\cdot 0,4 + 0,75 \\cdot 0,75 = 0,1 + 0,5625 = 0,6625$.\n\t\tXác suất An không đi:\n\t\t$P(\\bar{A}) = 1 - P(A) = 1 - 0,6625 = 0,3375$.\n\t\t\n\t\tXác suất Bình đi xem triển lãm tranh:\n\t\t$P(B) = P(A) \\cdot P(B|A) + P(\\bar{A}) \\cdot P(B|\\bar{A})$\n\t\t$P(B) = 0,6625 \\cdot 0,9 + 0,3375 \\cdot 0 = 0,59625 = \\dfrac{477}{800}$.\n\t\tXác suất Bình không đi:\n\t\t$P(\\bar{B}) = 1 - P(B) = 1 - \\dfrac{477}{800} = \\dfrac{323}{800}$.\n\t\t\n\t\tXác suất Cao không đi:\n\t\t$P(\\bar{C}) = 1 - P(C) = 1 - 0,5 = 0,5$.\n\t\t\n\t\tGọi $D$ là biến cố \"ít nhất hai trong ba người bạn cùng đi xem triển lãm\".\n\t\tBiến cố $D$ có thể được phân tích thành tổng của các biến cố rời nhau sau:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>An và Bình đi, Cao không đi ($A \\cap B \\cap \\bar{C}$)</li><li>An và Cao đi, Bình không đi ($A \\cap \\bar{B} \\cap C$)</li><li>Bình và Cao đi, An không đi ($\\bar{A} \\cap B \\cap C$)</li><li>Cả ba người cùng đi ($A \\cap B \\cap C$)</li></ul>\n\t\tVậy, $P(D) = P(A \\cap B \\cap \\bar{C}) + P(A \\cap \\bar{B} \\cap C) + P(\\bar{A} \\cap B \\cap C) + P(A \\cap B \\cap C)$.\n\t\tVì $C$ độc lập với $A$ và $B$, ta có:\n\t\t$P(D) = P(A \\cap B) \\cdot P(\\bar{C}) + P(A \\cap \\bar{B}) \\cdot P(C) + P(\\bar{A} \\cap B) \\cdot P(C) + P(A \\cap B) \\cdot P(C)$.\n\t\t\n\t\tTính các xác suất thành phần:\n\t\t<ul class=\"list-disc pl-5 my-2 space-y-1\"><li>$P(A \\cap B) = P(A) \\cdot P(B|A) = 0,6625 \\cdot 0,9 = 0,59625$.</li><li>$P(A \\cap \\bar{B}) = P(A) \\cdot P(\\bar{B}|A) = P(A) \\cdot (1 - P(B|A)) = 0,6625 \\cdot (1 - 0,9) = 0,6625 \\cdot 0,1 = 0,06625$.</li><li>$P(\\bar{A} \\cap B) = P(\\bar{A}) \\cdot P(B|\\bar{A}) = 0,3375 \\cdot 0 = 0$.</li></ul>\n\t\t\n\t\tThay các giá trị vào công thức $P(D)$:\n\t\t$P(D) = (0,59625) \\cdot (0,5) + (0,06625) \\cdot (0,5) + (0) \\cdot (0,5) + (0,59625) \\cdot (0,5)$\n\t\t$P(D) = 0,298125 + 0,033125 + 0 + 0,298125$\n\t\t$P(D) = 0,629375$.\n\t\t\n\t\tLàm tròn kết quả đến hàng phần trăm:\n\t\t$P(D) \\approx 0,63$.","choiceHash":"","tfHashes":[],"shortHash":"7f99dbe4"}];
    // Cho phép truyền bổ sung ?gas=... trên URL nếu giáo viên muốn đổi link Apps Script mà không cần tạo lại file
    const urlParams = new URLSearchParams(window.location.search);
    const GAS_URL = (urlParams.get('gas') || CONFIG.gasWebAppUrl || '').trim();
    const EXAM_CODE = String(urlParams.get('exam') || CONFIG.examCode || 'MD101').trim();
    let idx = 0, answers = {}, submitted = false, rem = (CONFIG.duration || 45) * 60;
    let attemptId = '', startTimeIso = '';

    // Hàm gửi dữ liệu đa kênh (Đảm bảo 100% gửi tới Google Sheets kể cả khi trình duyệt chặn CORS redirect của Google)
    async function sendToGoogleSheets(payloadObj) {
      if (!GAS_URL) return { ok: false, noUrl: true };
      const jsonStr = JSON.stringify(payloadObj);
      // Kênh 1: POST chuẩn với text/plain;charset=utf-8 (Simple Request không kích hoạt OPTIONS preflight)
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: jsonStr
        });
        if (res.ok) {
          const data = await res.json();
          return data;
        }
      } catch (corsErr) {
        // Kênh 2: Nếu trình duyệt chặn đọc phản hồi redirect 302 của Google, gửi no-cors POST kết hợp GET query
        try {
          await fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: jsonStr
          });
          return { ok: true, opaque: true };
        } catch (noCorsErr) {
          try {
            const sep = GAS_URL.includes('?') ? '&' : '?';
            await fetch(GAS_URL + sep + 'payload=' + encodeURIComponent(jsonStr), { mode: 'no-cors' });
            return { ok: true, viaGet: true };
          } catch (finalErr) {
            return { ok: false, error: finalErr.message };
          }
        }
      }
      return { ok: false };
    }

    function h(s){let v=0x811c9dc5,c=String(s||'').trim().toLowerCase().replace(/,/g,'.').replace(/s+/g,'');for(let i=0;i<c.length;i++){v^=c.charCodeAt(i);v=Math.imul(v,0x01000193);}return('0000000'+(v>>>0).toString(16)).slice(-8);}

    function countAnswered() {
      let c = 0;
      QUESTIONS.forEach(q => {
        const a = answers[q.id];
        if (q.type === 'choice' && a) c++;
        else if (q.type === 'choiceTF' && a && Object.keys(a).length > 0) c++;
        else if (q.type === 'shortans' && a !== undefined && String(a).trim() !== '') c++;
      });
      return c;
    }

    function syncRealtimeProgress(statusLabel) {
      if (!GAS_URL || !attemptId) return;
      sendToGoogleSheets({
        action: 'updateProgress',
        attemptId: attemptId,
        examId: EXAM_CODE,
        examCode: EXAM_CODE,
        studentId: document.getElementById('sId').value.trim() || 'HS',
        studentCode: document.getElementById('sId').value.trim() || 'HS',
        studentName: document.getElementById('sName').value.trim() || 'Học sinh',
        className: document.getElementById('sClass').value.trim() || '',
        startTime: startTimeIso,
        currentQuestionIndex: idx + 1,
        completedQuestions: countAnswered(),
        totalQuestions: QUESTIONS.length,
        remainingSeconds: rem,
        status: statusLabel || 'Đang làm bài'
      });
    }

    function render(){
      const q = QUESTIONS[idx];
      let html = '<div class="font-bold text-blue-700 text-xs">Câu ' + (idx+1) + ' / ' + QUESTIONS.length + ' (' + q.points + ' điểm)</div><div class="text-base font-medium">' + q.stem + '</div>';
      if(q.type==='choice'){
        html += q.options.map(o => '<button onclick="pickChoice(''+q.id+'',''+o.label+'')" class="w-full text-left p-3 my-1 border rounded-xl '+(answers[q.id]===o.label?'border-blue-600 bg-blue-50 font-bold':'')+'">'+o.label+'. '+o.content+'</button>').join('');
      } else if(q.type==='choiceTF'){
        const m = answers[q.id] || {};
        html += '<div class="border border-slate-200 rounded-xl divide-y divide-slate-200 overflow-hidden">' + q.statements.map(s => '<div class="p-3.5 bg-white grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_auto] items-start md:items-center gap-3.5"><div class="min-w-0 break-words leading-relaxed text-sm md:text-base"><b class="inline-flex items-center justify-center w-6 h-6 rounded bg-purple-100 text-purple-800 text-xs mr-2">'+s.label+')</b><span>'+s.content+'</span></div><div class="flex items-center justify-end gap-2 shrink-0 pt-2 md:pt-0"><button onclick="pickTF(''+q.id+'',''+s.key+'',true)" class="px-4 py-2 rounded-lg font-extrabold text-xs border '+(m[s.key]===true?'bg-blue-600 text-white border-blue-600':'bg-slate-50 text-slate-700 border-slate-300')+'">ĐÚNG</button><button onclick="pickTF(''+q.id+'',''+s.key+'',false)" class="px-4 py-2 rounded-lg font-extrabold text-xs border '+(m[s.key]===false?'bg-rose-600 text-white border-rose-600':'bg-slate-50 text-slate-700 border-slate-300')+'">SAI</button></div></div>').join('') + '</div>';
      } else {
        html += '<input oninput="answers[''+q.id+'']=this.value;renderNav();" onblur="syncRealtimeProgress('Đang làm bài')" value="'+(answers[q.id]||'')+'" placeholder="Nhập đáp số..." class="w-full px-3 py-2 border-2 border-teal-500 rounded-xl font-mono" />';
      }
      if(submitted && q.solutionHtml){
        html += '<div class="mt-4 p-4 rounded-xl bg-amber-50 border border-amber-300 text-sm space-y-1.5"><div class="font-extrabold text-amber-950">📘 Lời giải chi tiết:</div><div>' + q.solutionHtml + '</div></div>';
      }
      html += '<div class="flex justify-between pt-4"><button onclick="if(idx>0){idx--;render();syncRealtimeProgress('Đang làm bài');}" class="px-4 py-1.5 border rounded-lg text-xs font-bold">Câu trước</button><button onclick="if(idx<QUESTIONS.length-1){idx++;render();syncRealtimeProgress('Đang làm bài');}" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold">Câu tiếp</button></div>';
      document.getElementById('qBox').innerHTML = html;
      renderNav();
      if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise();
    }
    function renderNav(){
      document.getElementById('navGrid').innerHTML = QUESTIONS.map((q,i) => '<button onclick="idx='+i+';render();" class="h-9 rounded font-bold text-xs '+(answers[q.id]?'bg-blue-600 text-white':'bg-slate-200')+'">'+(i+1)+'</button>').join('');
    }
    window.pickChoice = (qid,val)=>{if(!submitted){answers[qid]=val;render();syncRealtimeProgress('Đang làm bài');}};
    window.pickTF = (qid,k,val)=>{if(!submitted){answers[qid]=answers[qid]||{};answers[qid][k]=val;render();syncRealtimeProgress('Đang làm bài');}};

    document.getElementById('btnStart').onclick = async ()=>{
      const sName = document.getElementById('sName').value.trim();
      const sId = document.getElementById('sId').value.trim() || sName;
      const sClass = document.getElementById('sClass').value.trim() || '12A1';
      if (!sName) {
        document.getElementById('sName').focus();
        return;
      }
      attemptId = 'ATT_' + EXAM_CODE + '_' + Date.now().toString(36).toUpperCase();
      startTimeIso = new Date().toISOString();
      document.getElementById('studentInfoBar').classList.add('hidden');
      document.getElementById('examArea').classList.remove('hidden');
      render();
      setInterval(()=>{if(!submitted && rem>0){rem--;document.getElementById('timer').textContent=[Math.floor(rem/3600),Math.floor((rem%3600)/60),rem%60].map(v=>String(v).padStart(2,'0')).join(':');if(rem===0)document.getElementById('btnSubmit').click();}},1000);

      // Gửi sự kiện bắt đầu làm bài về Google Sheets
      await sendToGoogleSheets({
        action: 'startAttempt',
        attemptId: attemptId,
        examId: EXAM_CODE,
        examCode: EXAM_CODE,
        studentId: sId,
        studentCode: sId,
        studentName: sName,
        className: sClass,
        duration: CONFIG.duration || 45,
        totalQuestions: QUESTIONS.length
      });
    };

    document.getElementById('btnSubmit').onclick = async ()=>{
      if(submitted) return; submitted = true;
      let earned = 0, total = 0, correctCount = 0, wrongCount = 0, unansweredCount = 0;
      QUESTIONS.forEach(q => {
        const pts = Number(q.points||1);
        total += pts;
        const a = answers[q.id];
        if(q.type==='choice'){
          if(!a) unansweredCount++;
          else if(h(a)===q.choiceHash){ earned += pts; correctCount++; }
          else wrongCount++;
        } else if(q.type==='choiceTF'){
          const m = a||{};
          const keys = Object.keys(m);
          if(keys.length===0) unansweredCount++;
          else {
            let c=0;
            q.statements.forEach((s,si)=>{if(m[s.key]!==undefined && h(String(m[s.key]))===q.tfHashes[si]) c++;});
            earned += (pts*c)/4;
            if(c===4) correctCount++; else wrongCount++;
          }
        } else if(q.type==='shortans'){
          if(a===undefined || String(a).trim()==='') unansweredCount++;
          else if(h(a)===q.shortHash){ earned += pts; correctCount++; }
          else wrongCount++;
        }
      });
      const score = total>0 ? Number(((earned/total)*(CONFIG.maxScore||10)).toFixed(2)) : 0;
      render();
      const box = document.getElementById('resultBox');
      box.classList.remove('hidden');
      box.textContent = 'Đang gửi kết quả bài làm về Google Sheets của giáo viên...';

      const totalTimeSec = Math.max(1, ((CONFIG.duration || 45) * 60) - rem);
      const syncRes = await sendToGoogleSheets({
        action: 'submitAttempt',
        attemptId: attemptId || ('ATT_' + EXAM_CODE + '_' + Date.now().toString(36)),
        examId: EXAM_CODE,
        examCode: EXAM_CODE,
        studentId: document.getElementById('sId').value.trim() || 'HS',
        studentCode: document.getElementById('sId').value.trim() || 'HS',
        studentName: document.getElementById('sName').value.trim() || 'Học sinh',
        className: document.getElementById('sClass').value.trim() || '',
        startTime: startTimeIso || new Date().toISOString(),
        totalTimeSeconds: totalTimeSec,
        answers: answers,
        clientScore: score,
        clientCorrectCount: correctCount,
        clientWrongCount: wrongCount,
        clientUnansweredCount: unansweredCount,
        maxScore: CONFIG.maxScore || 10
      });

      if (syncRes && syncRes.ok) {
        box.textContent = '✅ Đã nộp bài và lưu điểm thành công lên Google Sheets! Điểm đạt được: ' + score.toFixed(2) + ' / ' + (CONFIG.maxScore||10);
      } else if (!GAS_URL) {
        box.textContent = '✅ Đã hoàn thành bài thi! Điểm đạt được: ' + score.toFixed(2) + ' / ' + (CONFIG.maxScore||10) + ' (Lưu ý: Giáo viên chưa gắn link Google Sheets vào đề thi này).';
      } else {
        box.textContent = '✅ Đã chấm điểm: ' + score.toFixed(2) + ' / ' + (CONFIG.maxScore||10) + '. (Không thể kết nối Google Sheets, hãy chụp màn hình kết quả này gửi giáo viên).';
      }
    };
  </script>
</body>
</html>
